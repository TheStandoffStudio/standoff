      const Volume2 = (p) => <Icon {...p} path={<><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></>} />;

      /* =========================================================================
         SOUND ENGINE
         ========================================================================= */
      let audioCtx = null;
      let masterVolume = 1.0;

      function getAudioContext() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function setMasterVolume(vol) {
        masterVolume = Math.max(0, Math.min(1, vol));
        try { localStorage.setItem('standoff_volume', String(masterVolume)); } catch(e) {}
      }

      function playSound(type) {
        if (masterVolume <= 0) return;
        try {
          const actx = getAudioContext();
          const now = actx.currentTime;
          const osc = actx.createOscillator();
          const gain = actx.createGain();

          if (type === 'shoot') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(360, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.09);
            gain.gain.setValueAtTime(0.12 * masterVolume, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.09);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(now); osc.stop(now + 0.1);
          } else if (type === 'hit') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.linearRampToValueAtTime(40, now + 0.07);
            gain.gain.setValueAtTime(0.12 * masterVolume, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.07);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(now); osc.stop(now + 0.08);
          } else if (type === 'zombie_groan') {
            // Undead Zombie Groan
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(95, now);
            osc.frequency.linearRampToValueAtTime(70, now + 0.22);
            gain.gain.setValueAtTime(0.15 * masterVolume, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.24);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(now); osc.stop(now + 0.25);
          } else if (type === 'explosion') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(110, now);
            osc.frequency.exponentialRampToValueAtTime(12, now + 0.35);
            gain.gain.setValueAtTime(0.3 * masterVolume, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.35);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(now); osc.stop(now + 0.36);
          } else if (type === 'heal' || type === 'purchase' || type === 'level_up' || type === 'token') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(450, now);
            osc.frequency.exponentialRampToValueAtTime(900, now + 0.18);
            gain.gain.setValueAtTime(0.14 * masterVolume, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.2);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(now); osc.stop(now + 0.22);
          } else if (type === 'dash') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.linearRampToValueAtTime(550, now + 0.14);
            gain.gain.setValueAtTime(0.12 * masterVolume, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.14);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(now); osc.stop(now + 0.15);
          }
        } catch(e) {}
      }

      /* =========================================================================
         WEAPONS, SKINS & ECONOMY DATA
         ========================================================================= */

      const PLAYER_SKINS = [
        { id: 'spec-ops', name: 'Spec-Ops Unit', costGT: 0, description: 'Standard tactical bio-hazard armored suit.', bodyColor: '#1a365d', armorColor: '#3182ce', visorColor: '#63b3ed', badge: 'DEFAULT' },
        { id: 'cyber-neon', name: 'Cyber Neon', costGT: 10, description: 'Electrified nanoweave suit with teal glow.', bodyColor: '#042f2e', armorColor: '#0d9488', visorColor: '#22d3ee', badge: 'RARE' },
        { id: 'crimson-phantom', name: 'Crimson Phantom', costGT: 20, description: 'Infiltration chassis with thermal targeting.', bodyColor: '#450a0a', armorColor: '#dc2626', visorColor: '#fca5a5', badge: 'EPIC' },
        { id: 'golden-vanguard', name: 'Golden Vanguard', costGT: 35, description: 'Polished gold exoskeleton of apex survivors.', bodyColor: '#422006', armorColor: '#eab308', visorColor: '#fef08a', badge: 'LEGENDARY' }

      const WEAPON_EFFECTS = [
        { id: 'standard', name: 'Tactical Kinetic', costGT: 0, description: 'High-contrast kinetic tracer rounds.', tracerColor: '#facc15' },
        { id: 'plasma-cyan', name: 'Plasma Discharge', costGT: 10, description: 'Superheated cyan plasma pulses.', tracerColor: '#00ffff' },

      const DAILY_REWARDS = [

      const CRATE_LOOT_POOL = [
        { name: 'Rot-Cleaver Blade', rarity: 'common', icon: '🔪', desc: 'Rusty machete for close-quarters infected combat.' },
        { name: 'Toxic SMG', rarity: 'rare', icon: '⚡', desc: 'Turquoise anti-viral submachine gun.' },
        { name: 'Necro-Sniper', rarity: 'epic', icon: '👁️', desc: 'Long-range rifle with infrared mutant scope.' },

      const STORAGE_KEY = 'standoff_data_v4';

      function getInitialProgress() {
        const def = {
          gachaTokens: 10,
          crateKeys: 5,
          credits: 100,
          totalKills: 0,
          matchKills: 0,
          callsign: 'VIPER-01',
          highestSector: 1,
          equippedSkin: 'spec-ops',
          equippedWeaponEffect: 'standard',
          unlockedSkins: ['spec-ops'],
          unlockedEffects: ['standard'],
          battlePass: { level: 1, xp: 0, claimedLevels: [1] },
          dailyStreak: { streak: 0, lastClaimDate: '' },
          crateInventory: []
        };
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) return { ...def, ...JSON.parse(raw) };
        } catch(e) {}
        return def;
      }

      function saveProgress(data) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
      }

      /* =========================================================================
         COLLISION HELPER
         ========================================================================= */
      function canMoveTo(x, y, radius, barriers, barrierEnabled, width, height) {
        if (x < radius || x > width - radius || y < radius || y > height - radius) return false;
        if (!barrierEnabled || !barriers || barriers.length === 0) return true;
        for (let i = 0; i < barriers.length; i++) {
          const bar = barriers[i];
          const closestX = Math.max(bar.x, Math.min(x, bar.x + bar.w));
          const closestY = Math.max(bar.y, Math.min(y, bar.y + bar.h));
          const distX = x - closestX;
          const distY = y - closestY;
          if ((distX * distX + distY * distY) < (radius * radius)) return false;
        }
        return true;
      }

      /* =========================================================================
         GAME CANVAS (ZOMBIE INFESTATION + FLASHLIGHT + BUG-FREE ENGINE)
         ========================================================================= */
      const GameCanvas = ({
        gameMode, difficulty, isPaused, level, onLevelComplete, onPlayerHpChange,
        onCoinsEarned, onKill, onGameOver, equippedSkinId, inventory, currentWeaponIdx,
        onSelectWeapon, rollEnabled = true, barrierEnabled = true, externalHpHeal = null
      }) => {
        const canvasRef = useRef(null);

        const callbacksRef = useRef({ onLevelComplete, onPlayerHpChange, onCoinsEarned, onKill, onGameOver });
        useEffect(() => {
          callbacksRef.current = { onLevelComplete, onPlayerHpChange, onCoinsEarned, onKill, onGameOver };
        });

        const propsRef = useRef({ inventory, currentWeaponIdx, equippedSkinId, onSelectWeapon });
        useEffect(() => {
          propsRef.current = { inventory, currentWeaponIdx, equippedSkinId, onSelectWeapon };
        });

        const stateRef = useRef({
          player: {
            x: window.innerWidth / 2,
            y: window.innerHeight / 2,
            size: 9,
            baseSpeed: 4.8,
            hp: 100,
            maxHp: 100,
            shootTimer: 0,
            isDashing: false,
            dashTimer: 0,
            dashCooldown: 0,
            dashVx: 0,
            dashVy: 0,
            facingAngle: 0,
            lightFlicker: 1.0,
            isDead: false
          },
          mouse: { x: window.innerWidth / 2, y: window.innerHeight / 2, down: false },
          keys: {},
          bullets: [],
          enemies: [],
          barriers: [],
          crates: [],
          isTransitioningWave: false
        });

        useEffect(() => {
          if (externalHpHeal !== null) {
            stateRef.current.player.hp = Math.min(stateRef.current.player.maxHp, externalHpHeal);
          }
        }, [externalHpHeal]);

        const triggerRollDash = () => {
          const p = stateRef.current.player;
          if (!rollEnabled || p.dashCooldown > 0 || p.isDashing || isPaused || p.isDead) return;

          let dx = 0, dy = 0;
          if (stateRef.current.keys['w']) dy -= 1;
          if (stateRef.current.keys['s']) dy += 1;
          if (stateRef.current.keys['a']) dx -= 1;
          if (stateRef.current.keys['d']) dx += 1;

          if (dx === 0 && dy === 0) {
            dx = Math.cos(p.facingAngle);
            dy = Math.sin(p.facingAngle);
          }

          const mag = Math.hypot(dx, dy) || 1;
          p.isDashing = true;
          p.dashTimer = 10;
          p.dashCooldown = 32;
          p.dashVx = (dx / mag) * 7.5;
          p.dashVy = (dy / mag) * 7.5;
          playSound('dash');
        };

        const prevModeRef = useRef(null);

        // WAVE SPAWN SETUP (ZOMBIES)
        useEffect(() => {
          if (!gameMode) {
            prevModeRef.current = null;
            return;
          }

          const state = stateRef.current;
          state.isTransitioningWave = false;
          state.bullets = [];

          const isFreshLaunch = prevModeRef.current !== gameMode;
          prevModeRef.current = gameMode;

          if (isFreshLaunch) {
            state.player.x = window.innerWidth / 2;
            state.player.y = window.innerHeight / 2;
            state.player.hp = 100;
            state.player.isDead = false;
            state.player.isDashing = false;
            state.player.dashTimer = 0;
            state.player.dashCooldown = 0;
          }

          const width = window.innerWidth;
          const height = window.innerHeight;

          // SAFE BARRIERS
          state.barriers = [];
          if (barrierEnabled) {
            const count = 3 + Math.floor(Math.random() * 3);
            for (let i = 0; i < count; i++) {
              let bx = 0, by = 0, attempts = 0;
              do {
                bx = 120 + Math.random() * (width - 260);
                by = 100 + Math.random() * (height - 220);
                attempts++;
              } while (
                Math.hypot(bx + 40 - state.player.x, by + 10 - state.player.y) < 160 &&
                attempts < 30
              );

              state.barriers.push({
                x: bx, y: by, w: 70 + Math.random() * 50, h: 20, hp: 120, maxHp: 120
              });
            }
          }

          // SAFE CRATES
          state.crates = [];
          let cx = 0, cy = 0, attempts = 0;
          do {
            cx = 100 + Math.random() * (width - 200);
            cy = 100 + Math.random() * (height - 200);
            attempts++;
          } while (Math.hypot(cx - state.player.x, cy - state.player.y) < 140 && attempts < 25);
          state.crates.push({ x: cx, y: cy, timer: 0, opening: false, duration: 80 });

          // ZOMBIE ENEMY SPAWNING
          state.enemies = [];
          const count = Math.min(24, 4 + level * 2);
          for (let i = 0; i < count; i++) {
            const side = Math.floor(Math.random() * 4);
            let x = 0, y = 0;
            if (side === 0) { x = Math.random() * width; y = -40; }
            else if (side === 1) { x = width + 40; y = Math.random() * height; }
            else if (side === 2) { x = Math.random() * width; y = height + 40; }
            else { x = -40; y = Math.random() * height; }

            const isBoss = i === 0 && level % 5 === 0;
            let zombieType = 'walker';
            const r = Math.random();
            if (!isBoss) {
              if (r < 0.3) zombieType = 'runner';
              else if (r < 0.55 && level >= 2) zombieType = 'spitter';
            } else {
              zombieType = 'mutant_boss';
            }

            let hp = 40 + level * 7;
            let speed = 2.2 + Math.random() * 0.4;
            let size = 10;

            if (zombieType === 'runner') {
              speed = 3.6;
              hp = 25 + level * 4;
              size = 8.5;
            } else if (zombieType === 'spitter') {
              speed = 1.9;
              hp = 35 + level * 5;
            } else if (zombieType === 'mutant_boss') {
              speed = 1.8;
              hp = 300 + level * 35;
              size = 18;
            }

            state.enemies.push({
              x, y, hp, maxHp: hp, baseSpeed: speed, size,
              isBoss, type: zombieType, meleeCooldown: 0, spitCooldown: 0, wobble: Math.random() * Math.PI * 2
            });
          }
        }, [level, gameMode, barrierEnabled]);

        // GAME LOOP
        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          let animId;

          const resize = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const p = stateRef.current.player;
            p.x = Math.max(p.size + 4, Math.min(canvas.width - p.size - 4, p.x));
            p.y = Math.max(p.size + 4, Math.min(canvas.height - p.size - 4, p.y));
          };
          resize();
          window.addEventListener('resize', resize);

          const onKeyDown = (e) => {
            stateRef.current.keys[e.key.toLowerCase()] = true;
            if (['1','2','3','4'].includes(e.key)) {
              propsRef.current.onSelectWeapon(parseInt(e.key) - 1);
            }
            if (e.key === ' ') {
              triggerRollDash();
              e.preventDefault();
            }
          };

          const onKeyUp = (e) => { stateRef.current.keys[e.key.toLowerCase()] = false; };
          const onMouseMove = (e) => {
            stateRef.current.mouse.x = e.clientX;
            stateRef.current.mouse.y = e.clientY;
          };
          const onMouseDown = () => { if (!isPaused) stateRef.current.mouse.down = true; };
          const onMouseUp = () => { stateRef.current.mouse.down = false; };
          const onBlur = () => {
            stateRef.current.mouse.down = false;
            stateRef.current.keys = {};
          };

          window.addEventListener('keydown', onKeyDown);
          window.addEventListener('keyup', onKeyUp);
          window.addEventListener('mousemove', onMouseMove);
          window.addEventListener('mousedown', onMouseDown);
          window.addEventListener('mouseup', onMouseUp);
          window.addEventListener('blur', onBlur);

          const loop = () => {
            const state = stateRef.current;
            const p = state.player;
            const currentGun = propsRef.current.inventory[propsRef.current.currentWeaponIdx] || MASTER_WEAPONS[0];
            const activeSkin = PLAYER_SKINS.find((s) => s.id === propsRef.current.equippedSkinId) || PLAYER_SKINS[0];

            if (gameMode && !isPaused && p.hp > 0 && !p.isDead) {
              if (p.dashCooldown > 0) p.dashCooldown--;

              p.facingAngle = Math.atan2(state.mouse.y - p.y, state.mouse.x - p.x);
              p.lightFlicker = 0.96 + Math.random() * 0.08;

              // ROLL DASH
              if (rollEnabled && p.isDashing) {
                const subSteps = 3;
                const stepX = p.dashVx / subSteps;
                const stepY = p.dashVy / subSteps;

                for (let s = 0; s < subSteps; s++) {
                  if (canMoveTo(p.x + stepX, p.y, p.size, state.barriers, barrierEnabled, canvas.width, canvas.height)) {
                    p.x += stepX;
                  } else { p.dashVx = 0; }
                  if (canMoveTo(p.x, p.y + stepY, p.size, state.barriers, barrierEnabled, canvas.width, canvas.height)) {
                    p.y += stepY;
                  } else { p.dashVy = 0; }
                }

                p.dashVx *= 0.94;
                p.dashVy *= 0.94;
                p.dashTimer--;
                if (p.dashTimer <= 0) {
                  p.isDashing = false;
                  p.dashVx = 0; p.dashVy = 0;
                }
              } else {
                // WASD MOVEMENT
                let dx = 0, dy = 0;
                if (state.keys['w']) dy -= 1;
                if (state.keys['s']) dy += 1;
                if (state.keys['a']) dx -= 1;
                if (state.keys['d']) dx += 1;
                if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

                const stepX = dx * p.baseSpeed;
                const stepY = dy * p.baseSpeed;

                if (canMoveTo(p.x + stepX, p.y, p.size, state.barriers, barrierEnabled, canvas.width, canvas.height)) p.x += stepX;
                if (canMoveTo(p.x, p.y + stepY, p.size, state.barriers, barrierEnabled, canvas.width, canvas.height)) p.y += stepY;
              }

              p.x = Math.max(p.size + 4, Math.min(canvas.width - p.size - 4, p.x));
              p.y = Math.max(p.size + 4, Math.min(canvas.height - p.size - 4, p.y));

              // SHOOTING
              if (p.shootTimer > 0) p.shootTimer--;
              if (state.mouse.down && p.shootTimer <= 0 && !p.isDashing) {
                playSound('shoot');
                const angle = p.facingAngle;
                const pellets = currentGun.pellets || 1;
                for (let i = 0; i < pellets; i++) {
                  const spread = pellets > 1 ? (Math.random() - 0.5) * 0.25 : 0;
                  state.bullets.push({
                    x: p.x + Math.cos(angle) * 10,
                    y: p.y + Math.sin(angle) * 10,
                    vx: Math.cos(angle + spread) * currentGun.speed,
                    vy: Math.sin(angle + spread) * currentGun.speed,
                    damage: currentGun.damage,
                    isPlayer: true,
                    color: '#facc15'
                  });
                }
                p.shootTimer = currentGun.cooldown;
              }

              // BULLETS & SPIT PROJECTILES
              for (let i = state.bullets.length - 1; i >= 0; i--) {
                const b = state.bullets[i];
                b.x += b.vx; b.y += b.vy;

                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                  state.bullets.splice(i, 1);
                  continue;
                }

                if (barrierEnabled) {
                  let hit = false;
                  for (const bar of state.barriers) {
                    if (b.x > bar.x && b.x < bar.x + bar.w && b.y > bar.y && b.y < bar.y + bar.h) {
                      bar.hp -= b.damage; hit = true; break;
                    }
                  }
                  if (hit) { state.bullets.splice(i, 1); continue; }
                }

                // Enemy bullet / spit hit on player
                if (!b.isPlayer) {
                  if (Math.hypot(b.x - p.x, b.y - p.y) < p.size + 4 && !p.isDashing) {
                    p.hp -= b.damage;
                    playSound('hit');
                    callbacksRef.current.onPlayerHpChange(p.hp, p.maxHp);
                    state.bullets.splice(i, 1);
                    continue;
                  }
                }
              }
              if (barrierEnabled) state.barriers = state.barriers.filter((bar) => bar.hp > 0);

              // ZOMBIES LOGIC
              for (let ei = state.enemies.length - 1; ei >= 0; ei--) {
                const z = state.enemies[ei];
                z.wobble += 0.08;
                const angle = Math.atan2(p.y - z.y, p.x - z.x);

                // Spitter keeps tactical distance
                let moveMult = 1.0;
                if (z.type === 'spitter') {
                  const dist = Math.hypot(p.x - z.x, p.y - z.y);
                  if (dist < 220) moveMult = -0.7;
                }

                z.x += (Math.cos(angle) + Math.sin(z.wobble) * 0.15) * z.baseSpeed * moveMult;
                z.y += (Math.sin(angle) + Math.cos(z.wobble) * 0.15) * z.baseSpeed * moveMult;

                // Spitter toxic vomit attack
                if (z.type === 'spitter') {
                  z.spitCooldown = (z.spitCooldown || 0) + 1;
                  if (z.spitCooldown > 90 && Math.hypot(p.x - z.x, p.y - z.y) < 420) {
                    z.spitCooldown = 0;
                    playSound('zombie_groan');
                    state.bullets.push({
                      x: z.x, y: z.y,
                      vx: Math.cos(angle) * 7, vy: Math.sin(angle) * 7,
                      damage: 15, isPlayer: false, color: '#84cc16'
                    });
                  }
                }

                // Zombie melee scratch & bite
                if (Math.hypot(p.x - z.x, p.y - z.y) < p.size + z.size) {
                  z.meleeCooldown++;
                  if (z.meleeCooldown > 32) {
                    z.meleeCooldown = 0;
                    playSound('zombie_groan');
                    if (!p.isDashing) {
                      p.hp -= z.isBoss ? 24 : z.type === 'runner' ? 14 : 10;
                      callbacksRef.current.onPlayerHpChange(p.hp, p.maxHp);
                    }
                  }
                }

                // Bullets hit on zombie
                for (let bi = state.bullets.length - 1; bi >= 0; bi--) {
                  const b = state.bullets[bi];
                  if (b.isPlayer && Math.hypot(b.x - z.x, b.y - z.y) < z.size + 4) {
                    z.hp -= b.damage;
                    playSound('hit');
                    state.bullets.splice(bi, 1);
                  }
                }

                // Zombie death
                if (z.hp <= 0) {
                  playSound('explosion');
                  callbacksRef.current.onKill();
                  callbacksRef.current.onCoinsEarned(z.isBoss ? 60 : 15);
                  state.enemies.splice(ei, 1);
                }
              }

              // CRATES
              state.crates.forEach((c, ci) => {
                if (Math.hypot(p.x - c.x, p.y - c.y) < p.size + 20) {
                  c.opening = true; c.timer++;
                  if (c.timer >= c.duration) {
                    playSound('heal');
                    p.hp = Math.min(p.maxHp, p.hp + 40);
                    callbacksRef.current.onPlayerHpChange(p.hp, p.maxHp);
                    callbacksRef.current.onCoinsEarned(25);
                    state.crates.splice(ci, 1);
                  }
                } else { c.opening = false; c.timer = 0; }
              });

              if (state.enemies.length === 0 && !state.isTransitioningWave) {
                state.isTransitioningWave = true;
                callbacksRef.current.onLevelComplete();
              }

              if (p.hp <= 0 && !p.isDead) {
                p.isDead = true;
                callbacksRef.current.onGameOver();
              }
            }

            // =========================================================
            // RENDERING: NIGHT-OPS ZOMBIE ARENA
            // =========================================================
            ctx.fillStyle = '#060a07';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Floor grid
            ctx.strokeStyle = 'rgba(34, 197, 94, 0.03)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 50) {
              ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 50) {
              ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Barriers
            if (barrierEnabled) {
              state.barriers.forEach((bar) => {
                ctx.fillStyle = '#143820';
                ctx.strokeStyle = '#22c55e';
                ctx.lineWidth = 1.5;
                ctx.fillRect(bar.x, bar.y, bar.w, bar.h);
                ctx.strokeRect(bar.x, bar.y, bar.w, bar.h);
                ctx.fillStyle = '#4ade80';
                ctx.fillRect(bar.x, bar.y - 5, bar.w * (bar.hp / bar.maxHp), 2.5);
              });
            }

            // Crates
            state.crates.forEach((c) => {
              ctx.fillStyle = '#78350f';
              ctx.fillRect(c.x - 12, c.y - 12, 24, 24);
              ctx.strokeStyle = '#f59e0b';
              ctx.lineWidth = 2;
              ctx.strokeRect(c.x - 12, c.y - 12, 24, 24);
              if (c.opening) {
                ctx.fillStyle = '#4ade80';
                ctx.fillRect(c.x - 12, c.y - 18, (c.timer / c.duration) * 24, 3);
              }
            });

            // RENDER ZOMBIES (DECAYED FLESH, SHUFFLING CLAWS, GLOWING EYES)
            for (const z of state.enemies) {
              ctx.save();
              ctx.translate(z.x, z.y);
              const zAngle = Math.atan2(p.y - z.y, p.x - z.x);
              ctx.rotate(zAngle);

              let fleshColor = '#15803d'; // Rotting green
              let clothesColor = '#1e293b'; // Tattered clothes
              let eyeColor = '#fef08a'; // Feral yellow eyes

              if (z.type === 'runner') {
                fleshColor = '#ca8a04'; clothesColor = '#7c2d12'; eyeColor = '#ef4444';
              } else if (z.type === 'spitter') {
                fleshColor = '#7e22ce'; clothesColor = '#3b0764'; eyeColor = '#84cc16';
              } else if (z.isBoss) {
                fleshColor = '#991b1b'; clothesColor = '#450a0a'; eyeColor = '#ff0000';
              }

              // Zombie Arms reaching out
              ctx.fillStyle = fleshColor;
              ctx.fillRect(z.size * 0.4, -z.size * 0.7, z.size * 0.8, 3);
              ctx.fillRect(z.size * 0.4, z.size * 0.4, z.size * 0.8, 3);

              // Zombie Body / Decaying clothes
              ctx.fillStyle = clothesColor;
              ctx.beginPath();
              ctx.arc(0, 0, z.size, 0, Math.PI * 2);
              ctx.fill();

              // Zombie Head / Rotting flesh
              ctx.fillStyle = fleshColor;
              ctx.beginPath();
              ctx.arc(z.size * 0.2, 0, z.size * 0.65, 0, Math.PI * 2);
              ctx.fill();

              // Glowing Undead Eyes
              ctx.fillStyle = eyeColor;
              ctx.shadowColor = eyeColor;
              ctx.shadowBlur = 6;
              ctx.beginPath();
              ctx.arc(z.size * 0.5, -2.5, 1.8, 0, Math.PI * 2);
              ctx.arc(z.size * 0.5, 2.5, 1.8, 0, Math.PI * 2);
              ctx.fill();
              ctx.shadowBlur = 0;

              // Health Bar
              ctx.rotate(-zAngle);
              if (z.isBoss || z.hp < z.maxHp) {
                const barWidth = z.size * 2.2;
                const hpRatio = Math.max(0, z.hp / z.maxHp);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(-barWidth / 2, -z.size - 9, barWidth, 3);
                ctx.fillStyle = z.isBoss ? '#ef4444' : '#22c55e';
                ctx.fillRect(-barWidth / 2, -z.size - 9, barWidth * hpRatio, 3);
              }
              ctx.restore();
            }

            // Bullets & Acid
            for (const b of state.bullets) {
              ctx.save();
              ctx.fillStyle = b.color;
              ctx.shadowColor = b.color;
              ctx.shadowBlur = 6;
              ctx.beginPath();
              ctx.arc(b.x, b.y, b.isPlayer ? 3 : 4.5, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }

            // TACTICAL FLASHLIGHT & LIGHT BEAM
            if (gameMode && p.hp > 0 && !p.isDead) {
              ctx.save();
              ctx.globalCompositeOperation = 'screen';

              const isFiring = p.shootTimer > currentGun.cooldown - 2;
              const flashBoost = isFiring ? 1.4 : 1.0;
              const beamDist = 310 * flashBoost;
              const beamAngle = 0.38;

              // Cone Beam
              const beamGrad = ctx.createRadialGradient(p.x, p.y, 10, p.x, p.y, beamDist);
              beamGrad.addColorStop(0, `rgba(255, 255, 235, ${0.55 * p.lightFlicker * flashBoost})`);
              beamGrad.addColorStop(0.25, `rgba(220, 245, 255, ${0.35 * p.lightFlicker})`);
              beamGrad.addColorStop(0.65, `rgba(160, 225, 255, ${0.15 * p.lightFlicker})`);
              beamGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

              ctx.fillStyle = beamGrad;
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.arc(p.x, p.y, beamDist, p.facingAngle - beamAngle, p.facingAngle + beamAngle);
              ctx.closePath();
              ctx.fill();

              // Core Beam
              const coreGrad = ctx.createRadialGradient(p.x, p.y, 5, p.x, p.y, beamDist * 0.8);
              coreGrad.addColorStop(0, `rgba(255, 255, 255, ${0.45 * p.lightFlicker})`);
              coreGrad.addColorStop(0.5, `rgba(210, 240, 255, ${0.18 * p.lightFlicker})`);
              coreGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

              ctx.fillStyle = coreGrad;
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.arc(p.x, p.y, beamDist * 0.8, p.facingAngle - 0.12, p.facingAngle + 0.12);
              ctx.closePath();
              ctx.fill();

              // 360 Personal Body Glow
              const bodyLightRadius = 90 * flashBoost;
              const bodyLight = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, bodyLightRadius);
              bodyLight.addColorStop(0, `rgba(255, 255, 240, ${0.45 * p.lightFlicker})`);
              bodyLight.addColorStop(0.35, `rgba(34, 211, 238, ${0.2 * p.lightFlicker})`);
              bodyLight.addColorStop(1, 'rgba(0, 0, 0, 0)');

              ctx.fillStyle = bodyLight;
              ctx.beginPath();
              ctx.arc(p.x, p.y, bodyLightRadius, 0, Math.PI * 2);
              ctx.fill();

              ctx.restore();
            }

            // Player Operator
            ctx.save();
            ctx.translate(p.x, p.y);
            if (p.isDashing) {
              ctx.fillStyle = 'rgba(34, 211, 238, 0.4)';
              ctx.beginPath();
              ctx.arc(0, 0, p.size + 4, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.rotate(p.facingAngle);
            ctx.fillStyle = activeSkin.bodyColor;
            ctx.beginPath();
            ctx.arc(0, 0, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = activeSkin.visorColor;
            ctx.fillRect(2, -3, 8, 6);
            ctx.restore();

            // Ambient darkness vignette
            ctx.save();
            const vigGrad = ctx.createRadialGradient(
              canvas.width / 2, canvas.height / 2, Math.min(canvas.width, canvas.height) * 0.35,
              canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) * 0.75
            );
            vigGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
            vigGrad.addColorStop(1, 'rgba(0, 0, 0, 0.65)');
            ctx.fillStyle = vigGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.restore();

            animId = requestAnimationFrame(loop);
          };

          animId = requestAnimationFrame(loop);

          return () => {
            cancelAnimationFrame(animId);
            window.removeEventListener('resize', resize);
            window.removeEventListener('keydown', onKeyDown);
            window.removeEventListener('keyup', onKeyUp);
            window.removeEventListener('mousemove', onMouseMove);
            window.removeEventListener('mousedown', onMouseDown);
            window.removeEventListener('mouseup', onMouseUp);
            window.removeEventListener('blur', onBlur);
          };
        }, [gameMode, isPaused, rollEnabled, barrierEnabled]);

        return <canvas ref={canvasRef} id="gameCanvas" className="block w-full h-full cursor-crosshair touch-none select-none" />;
      };

      /* =========================================================================
         ALL MODALS RESTORED: PROFILE, CRATES, SHOP, PASS, DAILY, ARMORY, SETTINGS
         ========================================================================= */
      // 1. PLAYER PROFILE DOSSIER
      const PlayerProfileModal = ({ isOpen, onClose, progress, onUpdateCallsign }) => {
        const [tab, setTab] = useState('overview');
        const [editing, setEditing] = useState(false);
        const [callsignInput, setCallsignInput] = useState(progress.callsign || 'VIPER-01');

        if (!isOpen) return null;

        const handleSave = () => {
          if (callsignInput.trim()) {
            onUpdateCallsign(callsignInput.trim().toUpperCase());
            setEditing(false);
            playSound('purchase');
          }

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-xl" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
            <div className="relative w-full max-w-2xl bg-[#0a0a0c]/95 border border-white/15 rounded-3xl p-6 shadow-2xl text-white">
              <button onClick={onClose} className="absolute top-4 right-4 p-2 text-gray-400 hover:text-white bg-white/5 rounded-full cursor-pointer"><X className="w-5 h-5" /></button>
              
              <div className="flex items-center gap-3 pb-4 border-b border-white/10">
                <div className="w-12 h-12 rounded-2xl bg-cyan-500/20 border border-cyan-400/40 flex items-center justify-center text-cyan-300">
                  <User className="w-6 h-6" />

                <div>
                  <div className="flex items-center gap-2">
                    {editing ? (
                      <div className="flex gap-1.5">
                        <input value={callsignInput} onChange={(e) => setCallsignInput(e.target.value)} maxLength={14} className="bg-black/60 border border-cyan-400 rounded px-2 py-0.5 text-xs font-bold text-cyan-300 uppercase" />

                    <span className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">OPERATOR</span>

              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 my-5">
                <div className="bg-white/5 p-3 rounded-2xl border border-white/10 text-center"><span className="text-[10px] text-gray-400 uppercase font-bold block">Total Kills</span><span className="text-xl font-black text-white">{progress.totalKills}</span></div>
                <div className="bg-white/5 p-3 rounded-2xl border border-white/10 text-center"><span className="text-[10px] text-gray-400 uppercase font-bold block">Gems Earned</span><span className="text-xl font-black text-cyan-300">{progress.gachaTokens.toFixed(1)} 💎</span></div>
                <div className="bg-white/5 p-3 rounded-2xl border border-white/10 text-center"><span className="text-[10px] text-gray-400 uppercase font-bold block">Coins In Bank</span><span className="text-xl font-black text-yellow-400">{progress.credits} 💰</span></div>
                <div className="bg-white/5 p-3 rounded-2xl border border-white/10 text-center"><span className="text-[10px] text-gray-400 uppercase font-bold block">Mystery Keys</span><span className="text-xl font-black text-amber-300">{progress.crateKeys} 🗝️</span></div>
              </div>

              <div className="text-right pt-2 border-t border-white/10">
                <button onClick={onClose} className="px-5 py-2 bg-white/10 hover:bg-white/20 text-white font-bold text-xs rounded-xl cursor-pointer">Close Dossier</button>
              </div>
            </div>
          </div>
        );
      };

      // 2. MYSTERY CRATES / GACHA MODAL
      const CrateGachaModal = ({ isOpen, onClose, crateKeys, credits, gachaTokens, onSpendKeys, onRewardGranted }) => {
        const [revealed, setRevealed] = useState(null);
        if (!isOpen) return null;

        const openBox = (cost, rarityPool) => {
          if (!onSpendKeys(cost)) return;
          playSound('purchase');

          onRewardGranted(chosen.name, chosen.rarity);

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-xl" onClick={(e) => { if (e.target === e.currentTarget && !revealed) onClose(); }}>
            <div className="relative w-full max-w-2xl bg-[#0a0a0c]/95 border border-white/15 rounded-3xl p-6 shadow-2xl text-white">
              <button onClick={onClose} className="absolute top-4 right-4 p-2 text-gray-400 hover:text-white bg-white/5 rounded-full cursor-pointer"><X className="w-5 h-5" /></button>

      /* =========================================================================
         MAIN APP CONTAINER WITH ALL HUBS RESTORED
         ========================================================================= */
      function App() {
        const [progress, setProgress] = useState(getInitialProgress);
        const [gameMode, setGameMode] = useState(null);
        const [level, setLevel] = useState(1);
        const [isPaused, setIsPaused] = useState(false);
        const [isGameOver, setIsGameOver] = useState(false);
        const [playerHp, setPlayerHp] = useState(100);
        const [playerMaxHp] = useState(100);
        const [externalHpHeal, setExternalHpHeal] = useState(null);
        const [inventory, setInventory] = useState(MASTER_WEAPONS);
        const [currentWeaponIdx, setCurrentWeaponIdx] = useState(0);

        // Modals state
        const [isProfileOpen, setIsProfileOpen] = useState(false);
        const [isCratesOpen, setIsCratesOpen] = useState(false);
        const [isShopOpen, setIsShopOpen] = useState(false);
        const [isPassOpen, setIsPassOpen] = useState(false);
        const [isDailyOpen, setIsDailyOpen] = useState(false);
        const [isArmoryOpen, setIsArmoryOpen] = useState(false);
        const [isSettingsOpen, setIsSettingsOpen] = useState(false);

        const [volume, setVolume] = useState(1.0);
        const [rollEnabled, setRollEnabled] = useState(true);

        const handleStartGame = (mode) => {
          setGameMode(mode);
          setIsPaused(false);
          setIsGameOver(false);
          setLevel(1);
          setPlayerHp(100);
          setExternalHpHeal(100);
        };

        const handleKill = () => {
          setProgress((prev) => {
            const next = {
              ...prev,
              totalKills: prev.totalKills + 1,
              matchKills: prev.matchKills + 1,
              gachaTokens: prev.gachaTokens + 0.5
            };
            saveProgress(next);
            return next;
          });
        };

        const handleCoinsEarned = (amount) => {
          setProgress((prev) => {
            const next = { ...prev, credits: prev.credits + amount };
            saveProgress(next);
            return next;
          });
        };

        const handleSpendKeys = (cost) => {
          if (progress.crateKeys < cost) return false;
          setProgress((prev) => {
            const next = { ...prev, crateKeys: prev.crateKeys - cost };
            saveProgress(next);
            return next;
          });
          return true;
        };

        const handleUpgradeWeapon = (idx) => {
          const gun = inventory[idx];
          if ((gun.level || 1) >= 10) return;
          const cost = (gun.level || 1) * 10;
          if (progress.credits >= cost) {
            handleCoinsEarned(-cost);
            setInventory((prev) => {
              const next = [...prev];
              next[idx] = { ...next[idx], level: next[idx].level + 1, damage: next[idx].damage + 5 };
              return next;
            });
            playSound('purchase');
          }
        };

        const handleBuyMedkit = () => {
          if (progress.credits >= 15 && playerHp < playerMaxHp) {
            handleCoinsEarned(-15);
            const healed = Math.min(playerMaxHp, playerHp + 40);
            setPlayerHp(healed);
            setExternalHpHeal(healed);
            playSound('heal');
          }
        };

        const handleClaimDaily = () => {
          setProgress((prev) => {
            const next = { ...prev, credits: prev.credits + 200, gachaTokens: prev.gachaTokens + 3, crateKeys: prev.crateKeys + 1 };
            saveProgress(next);
            return next;
          });
          playSound('level_up');
          setIsDailyOpen(false);
        };

        return (
          <div className="relative w-screen h-screen overflow-hidden bg-[#0a0a0c] font-sans text-white select-none">
            {/* Game Canvas */}
            {gameMode && (
              <GameCanvas
                gameMode={gameMode}
                difficulty="medium"
                isPaused={isPaused}
                level={level}
                onLevelComplete={() => {
                  playSound('level_up');
                  setLevel((l) => l + 1);
                }}
                onPlayerHpChange={(hp) => setPlayerHp(hp)}
                onCoinsEarned={handleCoinsEarned}
                onKill={handleKill}
                onGameOver={() => setIsGameOver(true)}
                equippedSkinId={progress.equippedSkin}
                inventory={inventory}
                currentWeaponIdx={currentWeaponIdx}
                onSelectWeapon={(idx) => setCurrentWeaponIdx(idx)}
                rollEnabled={rollEnabled}
                barrierEnabled={true}
                externalHpHeal={externalHpHeal}
              />
            )}

            {/* In-Game Top HUD */}
            {gameMode && (
              <header className="fixed top-0 left-0 right-0 z-20 p-3 sm:p-4 flex justify-between pointer-events-none">
                <div className="bg-black/80 border border-white/15 rounded-2xl px-4 py-2 pointer-events-auto flex items-center gap-3 shadow-xl">
                  <div className="flex items-center gap-1.5"><Heart className="w-4 h-4 text-red-500 fill-red-500" /><span className="font-mono font-bold text-red-400">{Math.round(playerHp)}</span></div>
                  <div className="border-l border-white/15 pl-3 text-cyan-400 font-bold text-xs">WAVE {level}</div>
                  <div className="border-l border-white/15 pl-3 text-emerald-400 font-bold text-xs">💀 {progress.matchKills}</div>
                  <div className="border-l border-white/15 pl-3 text-yellow-400 font-bold text-xs">💰 {progress.credits}</div>
                  <button onClick={() => setIsArmoryOpen(true)} className="ml-2 px-2.5 py-1 bg-yellow-500/20 text-yellow-300 rounded-xl text-xs font-bold uppercase cursor-pointer">Guns</button>
                </div>

                <div className="flex gap-2 pointer-events-auto">
                  <button onClick={() => setIsPaused(!isPaused)} className="px-3 py-2 bg-black/80 border border-white/15 rounded-2xl text-xs font-bold cursor-pointer">{isPaused ? '▶ RESUME' : '⏸ PAUSE'}</button>
                  <button onClick={() => setGameMode(null)} className="px-3 py-2 bg-red-600 hover:bg-red-500 rounded-2xl font-bold text-xs uppercase cursor-pointer shadow-lg">Quit</button>
                </div>
              </header>
            )}

            {/* MAIN MENU WITH ALL ORIGINAL 4 HUBS & NAVIGATION */}
            {!gameMode && (
              <main className="absolute inset-0 z-20 flex items-center justify-center p-4 overflow-y-auto">
                <div className="w-full max-w-lg bg-black/80 backdrop-blur-2xl border border-white/15 rounded-3xl p-6 shadow-2xl flex flex-col gap-4 relative z-10 my-auto">
                  
                  {/* Top Bar: Profile Pill + 3 Currencies */}
                  <div className="flex items-center justify-between gap-2 pb-3 border-b border-white/10 flex-wrap">
                    <button onClick={() => setIsProfileOpen(true)} className="flex items-center gap-1.5 px-3 py-1.5 bg-white/10 hover:bg-white/15 border border-white/15 rounded-xl text-xs font-bold cursor-pointer">
                      <User className="w-3.5 h-3.5 text-cyan-400" />
                      <span>{progress.callsign || 'VIPER-01'}</span>
                    </button>

                    <div className="flex items-center gap-1.5">
                      <button onClick={() => setIsArmoryOpen(true)} className="px-2.5 py-1 bg-yellow-500/15 border border-yellow-500/35 rounded-xl text-xs font-bold text-yellow-300 cursor-pointer">💰 {progress.credits}</button>
                      <button onClick={() => setIsShopOpen(true)} className="px-2.5 py-1 bg-cyan-500/15 border border-cyan-500/35 rounded-xl text-xs font-bold text-cyan-300 cursor-pointer">💎 {progress.gachaTokens.toFixed(1)}</button>
                      <button onClick={() => setIsCratesOpen(true)} className="px-2.5 py-1 bg-amber-500/15 border border-amber-500/35 rounded-xl text-xs font-bold text-amber-300 cursor-pointer">🗝️ {progress.crateKeys}</button>
                    </div>

                    <button onClick={() => setIsSettingsOpen(true)} className="p-1.5 bg-white/10 hover:bg-white/15 rounded-xl text-gray-300 cursor-pointer"><Sliders className="w-4 h-4" /></button>
                  </div>

                  {/* Title */}
                  <div className="text-center py-1">
                    <h1 className="text-3xl sm:text-4xl font-black uppercase text-white tracking-wider drop-shadow-[0_0_25px_rgba(34,197,94,0.3)]">STANDOFF 2</h1>
                    <p className="text-xs font-bold text-emerald-400 uppercase tracking-widest mt-0.5">Zombie Outbreak Survival 🧟‍♂️</p>
                  </div>

                  {/* BIG PLAY BUTTON */}
                  <button onClick={() => handleStartGame('campaign')} className="w-full py-4 bg-gradient-to-r from-emerald-500 via-teal-500 to-emerald-600 hover:from-emerald-400 hover:to-teal-500 text-white font-black text-lg uppercase rounded-2xl shadow-[0_0_25px_rgba(16,185,129,0.3)] transition hover:scale-[1.01] active:scale-95 cursor-pointer flex items-center justify-center gap-2">
                    <Play className="w-5 h-5 fill-white" />
                    <span>DEPLOY TO COMBAT</span>
                  </button>

                  {/* 4 MAIN EASY GAME HUBS */}
                  <div className="grid grid-cols-2 gap-3 w-full">
                    {/* 1. Armory */}
                    <button onClick={() => setIsArmoryOpen(true)} className="bg-yellow-500/10 hover:bg-yellow-500/20 border border-yellow-500/30 rounded-2xl p-3.5 transition active:scale-95 cursor-pointer text-left flex flex-col gap-1">
                      <div className="flex justify-between items-center"><span className="text-xl">🔫</span><span className="text-[10px] font-mono text-yellow-400 font-bold">{progress.credits} 💰</span></div>
                      <div className="text-sm font-black text-white">Weapons</div>
                      <div className="text-[11px] text-gray-400">Upgrade firearms</div>
                    </button>

                    {/* 2. Mystery Crates */}
                    <button onClick={() => setIsCratesOpen(true)} className="bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 rounded-2xl p-3.5 transition active:scale-95 cursor-pointer text-left flex flex-col gap-1">
                      <div className="flex justify-between items-center"><span className="text-xl">📦</span><span className="text-[10px] font-mono text-amber-400 font-bold">{progress.crateKeys} 🗝️</span></div>
                      <div className="text-sm font-black text-white">Mystery Crates</div>
                      <div className="text-[11px] text-gray-400">Gacha unboxing</div>
                    </button>

                    {/* 3. Outfits & Skins */}
                    <button onClick={() => setIsShopOpen(true)} className="bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/30 rounded-2xl p-3.5 transition active:scale-95 cursor-pointer text-left flex flex-col gap-1">
                      <div className="flex justify-between items-center"><span className="text-xl">👕</span><span className="text-[10px] font-mono text-cyan-400 font-bold">{progress.gachaTokens.toFixed(1)} 💎</span></div>
                      <div className="text-sm font-black text-white">Armor Vault</div>
                      <div className="text-[11px] text-gray-400">Custom survivor suits</div>
                    </button>

                    {/* 4. Battle Pass */}
                    <button onClick={() => setIsPassOpen(true)} className="bg-fuchsia-500/10 hover:bg-fuchsia-500/20 border border-fuchsia-500/30 rounded-2xl p-3.5 transition active:scale-95 cursor-pointer text-left flex flex-col gap-1">
                      <div className="flex justify-between items-center"><span className="text-xl">🏆</span><span className="text-[10px] font-mono text-fuchsia-400 font-bold">Tier {level}</span></div>
                      <div className="text-sm font-black text-white">Rewards Pass</div>
                      <div className="text-[11px] text-gray-400">Free sector loot</div>
                    </button>
                  </div>

                  {/* Daily Bonus Button */}
                  <button onClick={() => setIsDailyOpen(true)} className="p-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-2xl flex items-center justify-between cursor-pointer transition active:scale-95">
                    <div className="flex items-center gap-2.5"><span className="text-xl">🎁</span><span className="text-xs font-bold text-yellow-300">Daily Biohazard Supply Drop</span></div>
                    <span className="text-[11px] text-gray-400 uppercase font-bold">Claim →</span>
                  </button>

                  <div className="text-[11px] text-gray-400 text-center">WASD Move · Aim Flashlight with Mouse · Left Click Shoot · Space Roll</div>
                </div>
              </main>
            )}

            {/* GAME OVER SCREEN */}
            {isGameOver && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4">
                <div className="p-8 bg-[#0a0a0c] border border-red-500/40 rounded-3xl text-center max-w-sm w-full shadow-2xl">
                  <ShieldAlert className="w-12 h-12 text-red-500 mx-auto mb-3" />
                  <h2 className="text-3xl font-black text-red-500 uppercase">Overrun by Horde</h2>
                  <p className="text-sm text-gray-400 my-3">Eliminated at Sector Wave {level}.</p>
                  <button onClick={() => handleStartGame('campaign')} className="w-full py-3 bg-gradient-to-r from-red-600 to-rose-700 text-white font-black text-xs uppercase rounded-xl mb-2 cursor-pointer">Retry Operation</button>
                  <button onClick={() => setGameMode(null)} className="w-full py-2.5 bg-white/10 hover:bg-white/20 text-white font-bold rounded-xl text-xs uppercase cursor-pointer">Main Menu</button>
                </div>
              </div>
            )}

            {/* MODALS */}
            <PlayerProfileModal isOpen={isProfileOpen} onClose={() => setIsProfileOpen(false)} progress={progress} onUpdateCallsign={(cs) => setProgress((p) => ({ ...p, callsign: cs }))} />
            <CrateGachaModal isOpen={isCratesOpen} onClose={() => setIsCratesOpen(false)} crateKeys={progress.crateKeys} credits={progress.credits} gachaTokens={progress.gachaTokens} onSpendKeys={handleSpendKeys} onRewardGranted={() => {}} />
            <CosmeticShopModal isOpen={isShopOpen} onClose={() => setIsShopOpen(false)} gachaTokens={progress.gachaTokens} unlockedSkins={progress.unlockedSkins} equippedSkin={progress.equippedSkin} onBuySkin={(s) => setProgress((p) => ({ ...p, gachaTokens: p.gachaTokens - s.costGT, unlockedSkins: [...p.unlockedSkins, s.id], equippedSkin: s.id }))} onEquipSkin={(id) => setProgress((p) => ({ ...p, equippedSkin: id }))} />
            <BattlePassModal isOpen={isPassOpen} onClose={() => setIsPassOpen(false)} level={level} onClaimTier={() => {}} />
            <DailyRewardModal isOpen={isDailyOpen} onClose={() => setIsDailyOpen(false)} canClaim={true} onClaim={handleClaimDaily} />
            <ArmoryShopModal isOpen={isArmoryOpen} onClose={() => setIsArmoryOpen(false)} coins={progress.credits} playerHp={playerHp} maxHp={playerMaxHp} inventory={inventory} onBuyMedkit={handleBuyMedkit} onUpgradeWeapon={handleUpgradeWeapon} />
            <SettingsModal isOpen={isSettingsOpen} onClose={() => setIsSettingsOpen(false)} volume={volume} onVolumeChange={setVolume} rollEnabled={rollEnabled} onToggleRoll={setRollEnabled} />
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
